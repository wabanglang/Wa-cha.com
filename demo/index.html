);bottom:clamp(8px,2.4vw,20px);display:flex;align-items:flex-end;gap:9px}.icon-btn{width:49px;height:49px;display:grid;place-items:center;border:1px solid #e9e3d18c;border-radius:15px;background:#121c33e8;color:#ecf3ff;box-shadow:0 3px 18px #0007;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(5px)}.icon-btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}.icon-btn:active{transform:scale(.95)}.choice:focus-visible~.toolbar .icon-btn{outline:3px solid #fff8;outline-offset:3px}.play-icon{display:none}#pause:checked~.toolbar .pause-icon{display:none}#pause:checked~.toolbar .play-icon{display:block}#gear:checked~.toolbar .gear-btn{background:#326277;border-color:#8ff3ff}.weapons{position:absolute;right:0;bottom:60px;display:none;flex-direction:column;gap:8px;padding:9px;border:1px solid #d4e5f866;border-radius:18px;background:#0e172adf;box-shadow:0 8px 24px #0007}#gear:checked~.toolbar .weapons{display:flex}.weapons .icon-btn{width:47px;height:47px;border-radius:12px}#w1:checked~.toolbar .weapon1,#w2:checked~.toolbar .weapon2,#w3:checked~.toolbar .weapon3{background:#245d6f;border-color:#85efff;box-shadow:0 0 0 1px #89dfff inset}.weapons .icon-btn svg{width:25px;height:25px}.tiny-mark{position:absolute;left:14px;bottom:15px;display:flex;gap:5px;align-items:center;z-index:6;pointer-events:none}.tiny-mark b{display:block;width:5px;height:17px;border:1px solid #fff6;transform:skew(-12deg);background:#d8f8ff6b}.tiny-mark b:nth-child(2){height:11px}.tiny-mark b:nth-child(3){height:21px;background:#f6c58cbb}

/* TERRAFORM v33: normalized bidirectional travel. One animation owns X translation.
   Four equal 750ms strokes per 3s cycle. Every stroke travels the same distance.
   Each turn reaches zero velocity: cubic-bezier(.42,0,.58,1).
   Anchor travel never exceeds min(1/9 stage width, one 64px avatar width).
   Crouch remains independent at 4.7s, preserving varying motion/posture combinations. */
.lane{width:min(11.111111%,64px);contain:layout style}
.runner{width:100%;height:116px;left:0;animation:normalizedStride 3s cubic-bezier(.42,0,.58,1) infinite}
.avatar{width:64px;height:116px;max-width:none;display:block}
@keyframes normalizedStride{
  0%,50%,100%{transform:translate3d(0,0,0)}
  25%,75%{transform:translate3d(100%,0,0)}
}
/* Native icon controls remain accessible; moving them below the arena prevents target occlusion. */
.toolbar{position:relative;inset:auto;width:100%;min-height:49px;margin-top:9px;display:flex;justify-content:flex-end;align-items:center;gap:9px}
.weapons{bottom:calc(100% + 9px);right:0}
#pause:focus-visible~.toolbar .pause-btn,
#gear:focus-visible~.toolbar .gear-btn,
#w1:focus-visible~.toolbar .weapon1,
#w2:focus-visible~.toolbar .weapon2,
#w3:focus-visible~.toolbar .weapon3{outline:3px solid #fff;outline-offset:3px}
.choice:focus-visible~.toolbar .icon-btn{outline:none}
#pause:focus-visible~.toolbar .pause-btn,
#gear:focus-visible~.toolbar .gear-btn,
#w1:focus-visible~.toolbar .weapon1,
#w2:focus-visible~.toolbar .weapon2,
#w3:focus-visible~.toolbar .weapon3{outline:3px solid #fff;outline-offset:3px}
/* Standalone file: no external dependencies. Preserve explicit motion request; accessible pause is always available. */
@media(max-width:360px){.toolbar{margin-top:7px}.icon-btn{min-width:48px;min-height:48px}}

/* TERRAFORM v34 — fast arcade hop; 0.60s airborne in each 3.0s gait cycle.
   The vertical motion is on a dedicated child: X and Y never compete for transform.
   6%-26% of 3.0s = 0.60s; the ascent is faster, the apex short, descent crisp.
   All remaining frames are grounded, preventing floating between hops.
   The CSS-only hop is intentionally timed, not a numerical gravity simulation. */
.jumper{position:relative;width:64px;height:116px;transform-origin:32px 107px;
  animation:quickArcadeJump 3s linear infinite;will-change:transform}
@keyframes quickArcadeJump{
  0%,6%{transform:translate3d(0,0,0) scaleY(1);animation-timing-function:cubic-bezier(.20,.68,.36,1)}
  17%{transform:translate3d(0,-54px,0) scaleY(1);animation-timing-function:cubic-bezier(.64,0,.88,.52)}
  26%{transform:translate3d(0,0,0) scaleY(1)}
  27.5%{transform:translate3d(0,0,0) scaleY(.96)}
  30%,100%{transform:translate3d(0,0,0) scaleY(1)}
}

/* TERRAFORM v35 — body-only motion. SVG leg paths remain fixed in the
   local body coordinate system. No independent leg transforms or gait cycles.
   The runner, jumper, and pose groups animate the rigid figure as a whole. */
.leg-l,.leg-r{animation:none;transform:none}


/* TERRAFORM v37 -- clarified spatial contract and motion observability.
   The 1/9 arena constraint limits displacement of the avatar's left anchor.
   The restored 64px-wide figure cannot fit in a 35px-wide lane on a 320px
   screen; its entire visible bounding box is instead constrained to the
   arena. No sprite resizing, gait animation, or clipping is introduced.
   The static rail + translating contact shadow make limited travel legible. */
.lane{width:11.111111%;max-width:64px;contain:none}
.motion-rail{position:absolute;z-index:0;left:0;bottom:-13px;width:100%;height:2px;background:repeating-linear-gradient(90deg,#c0f6f0aa 0 4px,transparent 4px 8px);pointer-events:none}
.motion-rail i{position:absolute;display:block;width:5px;height:12px;bottom:-5px;border-radius:3px;background:#d7fcf5;box-shadow:0 0 5px #9cf1dc55}
.motion-rail i:first-child{left:-2px}.motion-rail i:last-child{right:-2px}
.runner{z-index:2;will-change:transform}
.runner::after{content:"";position:absolute;z-index:-1;bottom:-10px;left:21px;width:26px;height:7px;border-radius:50%;background:#1c1b31a6;box-shadow:0 0 7px 4px #34263288;pointer-events:none}
/* Ancillary effects yield to accessibility without hiding the requested core motion.
   The always-reachable pause button is the explicit motion-off control. */
@media (prefers-reduced-motion:reduce){
  .scanline{display:none}
  .crosshair,.enemy,.enemy-shot{animation:none}
  .runner{animation-duration:4.5s}
  .jumper{animation-duration:4.5s}
  .pose{animation-duration:7.05s}
}


/* TERRAFORM v38 — inline vector environment and material polish.
   Layered background is decorative only. Player/enemy physics and 3s body motion unchanged. */
.stage{background:#292c50;box-shadow:inset 0 0 0 1px #ffcf9877,0 15px 48px #000a,0 0 0 1px #0c1027;border-color:#ffc8969a}
.stage:before,.stage:after{display:none}
.stage>.dunes,.stage>.ridge,.stage>.arch{display:none}
.scenery{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
.stage::selection{background:transparent}
.stage .scanline{z-index:1;opacity:.14;background-size:100% 8px}
.stage .lane{z-index:4}
.stage .enemy{z-index:4;filter:drop-shadow(1px 4px 1px #1b2038b0) drop-shadow(0 0 8px #fff1c02a)}
.stage .avatar{filter:drop-shadow(1px 5px 2px #17192cc7) drop-shadow(0 0 6px #ffe1a72c)}
.stage .beam{filter:drop-shadow(0 0 4px #72efff) drop-shadow(0 0 8px #9deeff)}
.stage .flash{filter:drop-shadow(0 0 4px #ffe39b)}
.stage .crosshair{border-color:#98fbffe6;border-width:1.5px;box-shadow:0 0 0 4px #4be5ef19,0 0 12px #5fe9f779,inset 0 0 10px #62d9ee1f}
.stage .crosshair:before,.stage .crosshair:after{background:#96f7fbb5}
.stage .enemy-shot{box-shadow:0 0 7px #ff6576,0 0 13px #ff6576a1}
.stage .ornament i{height:5px;background:linear-gradient(90deg,#a3f5eb,#e6ffdd);box-shadow:0 0 8px #99fff688}
.stage .ornament i:nth-child(3){background:linear-gradient(90deg,#f9d4a2,#f3a66e)}
.toolbar .icon-btn{background:linear-gradient(150deg,#23324bf5,#10192ef5);border:1px solid #e2d6b2a8;box-shadow:inset 0 1px #ffffff19,0 6px 20px #0009;border-radius:14px}
.toolbar .icon-btn svg{filter:drop-shadow(0 0 2px #a7efff32)}
.toolbar .icon-btn:active{background:#356277;transform:scale(.96)}
.toolbar .weapons{background:linear-gradient(140deg,#1b2a44ed,#0b1324f5);border-color:#99eaf2a1}
.motion-rail{background:repeating-linear-gradient(90deg,#dcf8d0b5 0 4px,transparent 4px 9px)}
.runner::after{box-shadow:0 0 7px 5px #2b253ea6}
@media(prefers-reduced-motion:reduce){.stage .scanline{display:none}}


/* TERRAFORM v39: weapon-selectable deterministic volley sizes.
   Each 2-second volley has three slots: .25/.41/.57 seconds from its start.
   The selected weapon exposes exactly 1, 2 or 3 muzzle events per volley.
   This is CSS choreography, NOT randomness, collision, damage or world-space physics. */
#w1:checked~.stage .shot.burst-2,
#w1:checked~.stage .shot.burst-3,
#w2:checked~.stage .shot.burst-3{display:none}
.muzzle-ring{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:muzzleRing 6s linear infinite;animation-delay:var(--delay);pointer-events:none}
@keyframes muzzleRing{
  0%{opacity:.7;transform:scale(.55)}
  1.5%{opacity:0;transform:scale(1.9)}
  1.51%,100%{opacity:0;transform:scale(.55)}
}
#pause:checked~.stage .muzzle-ring{animation-play-state:paused}
#w2:checked~.stage .muzzle-ring{stroke:#ffe58e}
#w3:checked~.stage .muzzle-ring{stroke:#ffacee}
/* Respect the operating-system reduced-motion preference: static scene by default.
   Normal motion remains 3s stride / 0.6s airborne. Pause remains available. */
@media(prefers-reduced-motion:reduce){
  /* Keep timelines available: user may explicitly opt in with the Play control. */
  .runner,.jumper,.pose,.arm,.beam,.flash,.muzzle-ring,.enemy-shot,.crosshair{
    animation-play-state:paused!important;
  }
}

/* TERRAFORM v40 — non-occluding horizontal weapon dock.
   Weapon choices live entirely below the arena, left of the existing buttons.
   Keyboard focus on a radio reveals its dock even if gear is not checked.
   Selected weapon is also encoded as 1/2/3 color-coded pips on the gear icon.
   All affordances are CSS-only; no extra rendered words or JS. */
.toolbar .weapons{
  position:absolute;right:114px;bottom:0;top:auto;
  flex-direction:row;align-items:center;gap:5px;
  padding:2px 4px;border-radius:13px;
}
.toolbar .weapons .icon-btn{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:10px}
#w1:focus-visible~.toolbar .weapons,
#w2:focus-visible~.toolbar .weapons,
#w3:focus-visible~.toolbar .weapons{display:flex}
.toolbar .gear-btn{position:relative}
.toolbar .gear-btn::after{
  content:"";position:absolute;bottom:3px;left:12px;
  width:5px;height:5px;border-radius:50%;background:#8df4ff;
  box-shadow:none;pointer-events:none;
}
#w2:checked~.toolbar .gear-btn::after{background:#ffe186;box-shadow:9px 0 #ffe186}
#w3:checked~.toolbar .gear-btn::after{background:#fb92e7;box-shadow:9px 0 #fb92e7,18px 0 #fb92e7}
/* Never hide keyboard focus under the menu surface. */
#w1:focus-visible~.toolbar .weapon1,
#w2:focus-visible~.toolbar .weapon2,
#w3:focus-visible~.toolbar .weapon3{outline:3px solid #fff;outline-offset:2px}


/* TERRAFORM v41 — enemy shot emerges from its visible muzzle, not helmet.
   At 52×95 the muzzle is (-11,58) in enemy SVG units; at 42×78 it scales.
   The projectile remains a CSS visual effect, not detached physics or damage. */
.enemy svg{overflow:visible}
.enemy-shot{bottom:calc(16% + 35px)}
@media(max-width:420px){.enemy-shot{right:calc(5% + 34px);bottom:calc(16% + 28px)}}

/* TERRAFORM v42 — muzzle-locked CSS visual fire.
   Projectile and ignition are descendants of the swaying enemy, so their
   launch point shares the enemy transform. Flight is still attached to that
   moving coordinate frame, not detached world-space ballistics.
   SVG muzzle: x=-11/52 width, y=58/95 height; projectile right edge aligns
   with muzzle x; mobile SVG aspect mismatch leaves <=0.15px vertical offset. */
/* Explicit 25% transform removes the inherited ~5.12px premature drift. */
@keyframes enemyFire{
  0%,24%{opacity:0;transform:translateX(0)}
  25%{opacity:1;transform:translateX(0)}
  67%{opacity:1;transform:translateX(-220px)}
  70%,100%{opacity:0;transform:translateX(-240px)}
}
.enemy-shot{
  right:calc(100% + 21.153846%);left:auto;
  top:calc(61.052632% - 2px);bottom:auto;
}
.enemy-ignition{
  position:absolute;pointer-events:none;z-index:6;
  right:calc(100% + 21.153846%);top:calc(61.052632% - 5px);
  width:10px;height:10px;transform:translateX(50%);
  border-radius:50%;background:#fff5d4;
  box-shadow:0 0 7px 4px #ff857a,0 0 16px 8px #fa496a70;
  opacity:0;animation:enemyIgnition 3.1s steps(1,end) infinite;
}
@keyframes enemyIgnition{
  0%,24.9%,29%,100%{opacity:0}
  25%,28.9%{opacity:1}
}
#pause:checked~.stage .enemy-ignition{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){
  .enemy-ignition{animation-play-state:paused!important}
}


/* TERRAFORM v43 — equal combatant scale and planted avatar feet.
   Source viewBoxes: player 64×116; enemy 64×116. Both meet the same baseline.
   Neutral player legs are fixed geometry with matching boot soles at y=114.
   No leg animations. Body-only crouching anchors to boot soles instead of pushing
   feet through the ground (prior y+15px shift during compression). */
.enemy,.enemy svg{width:64px;height:116px}
.enemy{right:8%;bottom:16%}
.avatar .pose{transform-origin:32px 114px}
@keyframes crouch{
  0%,12%,38%,54%,78%,100%{transform:scaleY(1)}
  20%,30%,65%,72%,89%,95%{transform:scaleY(.82)}
}
.leg-l,.leg-r,.enemy-legs{animation:none!important;transform:none!important}
/* Enemy muzzle coords: x=-12,y=62 of a 64×116 viewBox. Projectile is relative
   to the swaying enemy and starts at the SVG's actual barrel end. */
.enemy-shot,.enemy-ignition{right:calc(100% + 18.75%);left:auto}
.enemy-shot{top:calc(53.4482758621% - 2px);bottom:auto}
.enemy-ignition{top:calc(53.4482758621% - 5px);bottom:auto}
/* Reticle remains centered on the target torso, not its rifle. */
.crosshair{right:calc(8% - 7px);bottom:calc(16% + 31px)}
@media(max-width:420px){
 .enemy{right:5%;width:64px;height:116px}
 .crosshair{right:calc(5% - 7px);bottom:calc(16% + 31px)}
}

/* TERRAFORM v44 — stage-relative CSS projectile path (visual only).
   Separate the 64×116 enemy sprite's sway from its stationary stage anchor.
   The shot and ignition are siblings of the animated SVG; their trajectory
   therefore does NOT inherit enemy sway during flight. Both are anchored at
   the muzzle's neutral x=-12,y=62; the SVG returns to neutral from 23% to
   30% of its synchronized 3.1s cycle, including the 25% shot ignition.
   No hit detection, actual ballistics, or physics is implied. */
.enemy{animation:none!important}
.enemy svg{animation:enemyAimSway 3.1s ease-in-out infinite;will-change:transform}
@keyframes enemyAimSway{
  0%,23%,30%,100%{transform:translate3d(0,0,0)}
  12%{transform:translate3d(-6px,0,0)}
  60%{transform:translate3d(-7px,0,0)}
  78%{transform:translate3d(4px,0,0)}
}
#pause:checked~.stage .enemy svg{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.enemy svg{animation-play-state:paused!important}}
/* Radios are visually hidden: reveal their control surface whenever focused,
   not only when the browser decides focus is keyboard-visible. */
#w1:focus~.toolbar .weapons,
#w2:focus~.toolbar .weapons,
#w3:focus~.toolbar .weapons{display:flex}
#w1:focus~.toolbar .weapon1,
#w2:focus~.toolbar .weapon2,
#w3:focus~.toolbar .weapon3{outline:3px solid #fff;outline-offset:2px}

/* TERRAFORM v45 — preview movement red-team patch.
   Combat auto-runs in normal motion; reduced-motion is a STATIC preview with
   explicit user opt-in via the existing play/pause control (no JavaScript).
   The user can now recover motion inside previews that report 'reduce'. */
.toolbar{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;min-height:49px}
.toolbar .weapons{position:static;inset:auto;right:auto;bottom:auto;order:-1;margin-right:auto;flex-wrap:nowrap;max-width:100%}
.toolbar .shield-btn{flex:0 0 auto}
#shield:checked~.toolbar .shield-btn{background:#185e75;border-color:#8aebff;box-shadow:inset 0 0 0 1px #a2f4ff,0 0 13px #5dedfe70}
#shield:focus-visible~.toolbar .shield-btn,#shield:focus~.toolbar .shield-btn{outline:3px solid #fff;outline-offset:2px}
/* Body-mounted effects make tiny bounded movement visually apparent without
   increasing the player's 1/9-stage-width anchor excursion. */
.jumper{position:relative}

#target:focus-visible~.stage .enemy-target,

 background:linear-gradient(140deg,#21384fea,#0d1a34f3);box-shadow:0 8px 19px #030817c4,0 0 18px #71e1ff60;

 transform:rotate(45deg);background:#12263c;border-right:1px solid #b7faffc7;border-bottom:1px solid #b7faffc7}
.target-action{display:grid;place-items:center;min-width:49px;min-height:49px;width:49px;height:49px;
 border-radius:12px;border:1px solid #aceeff6b;color:#efffff;
 background:linear-gradient(#29415a,#14233a);cursor:pointer;touch-action:manipulation;
 box-shadow:inset 0 1px #fff4}

#target:checked~.stage .target-popover{display:flex}
#engage:checked~.stage .target-popover{display:none}
